[project]
name = "langchain-research"
version = "0.0.10"
description = "A LangChain agent powered by Ollama that uses tools from MCP servers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "isort>=9.0.2",
    "langchain[mcp]>=1.4.9",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.18",
    "markdownify>=1.1.0",
    "mcp[cli]>=2.0.0",
    "pyyaml>=6.0.1",
    "wcwidth>=0.9.4",
]

[dependency-groups]
dev = [
    "isort>=9.0.2",
]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.9.7",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
# -ra: Report all extra test outcomes (passed, skipped, failed, etc.)
# -q: Enable quiet mode for less cluttered output
# -v: Enable verbose output to display detailed test names and statuses
# --durations=5: Show the 10 slowest tests after the run (useful for performance tuning)
addopts = "-ra -q -v --durations=5"
testpaths = [
    "tests",
]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.ruff.lint.per-file-ignores]
"servers/*.py" = ["N999"]
